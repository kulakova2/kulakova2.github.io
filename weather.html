<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Погода в Васкелово</title>
    <style>
        .weather-banner {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            border-radius: 8px;
            padding: 12px 16px;
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .weather-icon {
            font-size: 24px;
        }
        .weather-temp {
            font-size: 18px;
            font-weight: bold;
            min-width: 50px;
        }
        .weather-location {
            font-size: 14px;
            opacity: 0.8;
            border-left: 1px solid #ccc;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <div class="weather-banner">
        <span class="weather-icon" id="weather-icon">⏳</span>
        <span class="weather-temp" id="weather-temp">--°C</span>
    </div>

    <script>
        async function loadWeather() {
            try {
                const API_KEY = '7aed8fd9e8ffe16580116dcfa41a3620'; 
                const city = 'Vaskelovo,RU';
                
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric&lang=ru`
                );
                const data = await response.json();

                document.getElementById('weather-temp').textContent = `${Math.round(data.main.temp)}°C`;
                document.getElementById('weather-icon').textContent = getIcon(data.weather[0].icon);
                
                // Добавляем описание погоды (например: "Облачно, небольшой дождь")
                const description = data.weather[0].description;
                document.getElementById('weather-icon').title = description.charAt(0).toUpperCase() + description.slice(1);
                
            } catch (error) {
                console.error('Ошибка загрузки погоды:', error);
                document.getElementById('weather-icon').textContent = '❌';
                document.getElementById('weather-temp').textContent = 'Нет данных';
            }
        }

        function getIcon(iconCode) {
            const icons = {
                '01d': '☀️', '01n': '🌙',  // ясно
                '02d': '⛅', '02n': '⛅',  // облачно
                '03d': '☁️', '03n': '☁️',  // пасмурно
                '04d': '☁️', '04n': '☁️',  // тучи
                '09d': '🌧️', '09n': '🌧️', // дождь
                '10d': '🌦️', '10n': '🌦️', // переменно
                '11d': '⛈️', '11n': '⛈️',  // гроза
                '13d': '❄️', '13n': '❄️',   // снег
                '50d': '🌫️', '50n': '🌫️'   // туман
            };
            return icons[iconCode] || '🌤️';
        }

        // Загружаем сразу и обновляем каждый час
        loadWeather();
        setInterval(loadWeather, 3600000); 
    </script>
</body>
</html>
